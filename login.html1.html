<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Buku Nara - Login</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fffbe8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ===== KOTAK LOGIN ===== */
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(120, 53, 15, 0.12);
    }

    .card h1 {
      font-family: Georgia, "Times New Roman", serif;
      color: #78350f;
      text-align: center;
      font-size: 34px;
    }

    .subtitle {
      text-align: center;
      color: #b45309;
      margin: 6px 0 28px;
      font-size: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #1f2937;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    input:focus {
      outline: none;
      border-color: #b45309;
      box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.15);
    }

    button { cursor: pointer; font-family: inherit; }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: #78350f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
    }
    .btn-login:hover { background: #5c2a0c; }

    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
    }

    .link-btn {
      background: none;
      border: none;
      color: #78350f;
      font-size: 15px;
    }
    .link-btn:hover { text-decoration: underline; }
    .link-btn.bold { font-weight: 700; }

    /* ===== MODAL BOX / POP UP ===== */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal.show { display: flex; }

    .modal-box {
      position: relative;
      background: #fff;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      border-radius: 14px;
      animation: muncul 0.25s ease;
    }
    .modal-box h2 {
      font-family: Georgia, serif;
      color: #78350f;
      margin-bottom: 8px;
    }
    .modal-box p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .tutup {
      position: absolute;
      top: 10px; right: 16px;
      font-size: 28px;
      color: #9ca3af;
      cursor: pointer;
    }
    .tutup:hover { color: #000; }

    @keyframes muncul {
      from { transform: translateY(-20px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>

<body>

  <!-- ===== FORM LOGIN ===== -->
  <div class="card">
    <h1>Toko Buku Nara</h1>
    <p class="subtitle">Silakan masuk ke akun Anda</p>

    <form id="formLogin">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nama@email.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Masukkan password" required>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="links">
      <button type="button" class="link-btn" id="btnLupa">Lupa Password?</button>
      <button type="button" class="link-btn bold" id="btnDaftar">Daftar Akun</button>
    </div>
  </div>

  <!-- ===== MODAL LUPA PASSWORD ===== -->
  <div class="modal" id="modalLupa">
    <div class="modal-box">
      <span class="tutup" onclick="tutupModal('modalLupa')">&times;</span>
      <h2>Lupa Password</h2>
      <p>Masukkan email Anda untuk menerima link reset password.</p>
      <form id="formLupa">
        <label for="emailLupa">Email</label>
        <input type="email" id="emailLupa" placeholder="nama@email.com" required>
        <button type="submit" class="btn-login">Kirim</button>
      </form>
    </div>
  </div>

  <!-- ===== MODAL DAFTAR ===== -->
  <div class="modal" id="modalDaftar">
    <div class="modal-box">
      <span class="tutup" onclick="tutupModal('modalDaftar')">&times;</span>
      <h2>Daftar Akun</h2>
      <p>Isi data berikut untuk membuat akun baru.</p>
      <form id="formDaftar">
        <label for="namaDaftar">Nama Lengkap</label>
        <input type="text" id="namaDaftar" placeholder="Nama lengkap" required>

        <label for="emailDaftar">Email</label>
        <input type="email" id="emailDaftar" placeholder="nama@email.com" required>

        <label for="passDaftar">Password</label>
        <input type="password" id="passDaftar" placeholder="Minimal 6 karakter" minlength="6" required>

        <button type="submit" class="btn-login">Daftar</button>
      </form>
    </div>
  </div>

  <script>
    // ===== DATA PENGGUNA =====
    // Email dan password yang valid untuk login
    var users = [
      { nama: "Nara",  email: "nara@email.com",  password: "123456" },
      { nama: "Admin", email: "admin@email.com", password: "admin123" }
    ];

    // ===== LOGIN =====
    document.getElementById("formLogin").addEventListener("submit", function (e) {
      e.preventDefault();

      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;

      var user = null;
      for (var i = 0; i < users.length; i++) {
        if (users[i].email === email && users[i].password === password) {
          user = users[i];
        }
      }

      if (user) {
        alert("Login berhasil! Selamat datang, " + user.nama);
        // Kalau halaman dashboard sudah dibuat, hapus tanda // di bawah ini:
        // window.location.href = "dashboard.html";
      } else {
        alert("email/password yang anda masukkan salah");
      }
    });

    // ===== MODAL =====
    function bukaModal(id)  { document.getElementById(id).classList.add("show"); }
    function tutupModal(id) { document.getElementById(id).classList.remove("show"); }

    document.getElementById("btnLupa").addEventListener("click", function () {
      bukaModal("modalLupa");
    });
    document.getElementById("btnDaftar").addEventListener("click", function () {
      bukaModal("modalDaftar");
    });

    // klik area gelap di luar kotak untuk menutup modal
    var semuaModal = document.querySelectorAll(".modal");
    for (var i = 0; i < semuaModal.length; i++) {
      semuaModal[i].addEventListener("click", function (e) {
        if (e.target === this) { tutupModal(this.id); }
      });
    }

    // ===== LUPA PASSWORD =====
    document.getElementById("formLupa").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("emailLupa").value.trim();
      var ada = false;
      for (var i = 0; i < users.length; i++) {
        if (users[i].email === email) { ada = true; }
      }

      if (ada) {
        alert("Link reset password telah dikirim ke " + email);
        tutupModal("modalLupa");
        this.reset();
      } else {
        alert("Email tidak terdaftar");
      }
    });

    // ===== DAFTAR =====
    document.getElementById("formDaftar").addEventListener("submit", function (e) {
      e.preventDefault();
      var nama = document.getElementById("namaDaftar").value.trim();
      var email = document.getElementById("emailDaftar").value.trim();
      var password = document.getElementById("passDaftar").value;

      for (var i = 0; i < users.length; i++) {
        if (users[i].email === email) {
          alert("Email sudah terdaftar");
          return;
        }
      }

      users.push({ nama: nama, email: email, password: password });
      alert("Pendaftaran berhasil, silakan login");
      tutupModal("modalDaftar");
      this.reset();
    });
  </script>

</body>
</html>
