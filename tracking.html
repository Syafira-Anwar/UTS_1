<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Buku Nara - Informasi Pengiriman</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fffbe8;
      min-height: 100vh;
    }

    .navbar {
      background: #78350f;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
    }
    .navbar h1 { font-family: Georgia, serif; font-size: 24px; }
    .navbar a {
      color: #78350f;
      background: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
    }
    .navbar a:hover { background: #fde68a; }

    .container { max-width: 800px; margin: 0 auto; padding: 32px 20px; }

    h2 { font-family: Georgia, serif; color: #78350f; margin-bottom: 6px; }
    .desc { color: #b45309; font-size: 15px; margin-bottom: 24px; }

    .box {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(120, 53, 15, 0.1);
      margin-bottom: 24px;
    }
    .box h3 { color: #78350f; margin-bottom: 16px; }

    /* ===== FORM CARI ===== */
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #1f2937; }
    .cari-row { display: flex; gap: 12px; }
    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus {
      outline: none;
      border-color: #b45309;
      box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.15);
    }
    .btn-cari {
      padding: 12px 30px;
      background: #78350f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-cari:hover { background: #5c2a0c; }

    .contoh { margin-top: 12px; font-size: 13px; color: #6b7280; }
    .contoh button {
      background: #fef3c7;
      color: #78350f;
      border: none;
      padding: 3px 10px;
      margin: 2px 2px 2px 4px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    .contoh button:hover { background: #fde68a; }

    /* ===== HASIL ===== */
    #hasil { display: none; }

    .pesan-error {
      background: #fee2e2;
      color: #b91c1c;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: none;
    }

    .pemesan-label { font-size: 13px; color: #6b7280; }
    .pemesan-nama { font-size: 24px; font-weight: 700; color: #78350f; font-family: Georgia, serif; }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      margin: 14px 0 18px;
    }

    /* progress bar */
    .progress { background: #f3e8d0; border-radius: 20px; height: 16px; overflow: hidden; }
    .progress-isi { height: 100%; width: 0; border-radius: 20px; transition: width 0.6s ease; }
    .persen { text-align: right; font-size: 13px; color: #6b7280; margin-top: 6px; }

    /* langkah-langkah */
    .langkah { display: flex; justify-content: space-between; margin-top: 18px; gap: 6px; }
    .step { flex: 1; text-align: center; font-size: 12px; color: #9ca3af; }
    .step .bulat {
      width: 34px; height: 34px;
      line-height: 34px;
      border-radius: 50%;
      background: #e5e7eb;
      color: #fff;
      font-weight: 700;
      margin: 0 auto 6px;
    }
    .step.selesai { color: #374151; }
    .step.selesai .bulat { background: var(--warna); }
    .step.aktif { font-weight: 700; color: #111827; }

    /* tabel detail */
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    td { padding: 12px 8px; border-bottom: 1px solid #f3e8d0; }
    td:first-child { color: #6b7280; width: 40%; }
    td:last-child { font-weight: 600; color: #1f2937; }
    tr:last-child td { border-bottom: none; }

    @media (max-width: 600px) {
      .cari-row { flex-direction: column; }
      .step { font-size: 11px; }
      .navbar { padding: 14px 16px; }
    }
  </style>
</head>

<body>

  <div class="navbar">
    <h1>Toko Buku Nara</h1>
    <a href="dashboard.html">&larr; Kembali ke Dashboard</a>
  </div>

  <div class="container">
    <h2>Informasi Pengiriman</h2>
    <p class="desc">Lacak status pesanan Anda dengan memasukkan Nomor Delivery Order.</p>

    <!-- ===== FORM CARI ===== -->
    <div class="box">
      <form id="formCari">
        <label for="nomorDO">Nomor Delivery Order</label>
        <div class="cari-row">
          <input type="text" id="nomorDO" placeholder="contoh: DO-001" required>
          <button type="submit" class="btn-cari">Cari</button>
        </div>
      </form>
      <div class="contoh" id="contoh">Coba nomor:</div>
    </div>

    <div class="pesan-error" id="pesanError"></div>

    <!-- ===== HASIL PENCARIAN ===== -->
    <div id="hasil">

      <div class="box">
        <div class="pemesan-label">Nama Pemesan</div>
        <div class="pemesan-nama" id="hNama"></div>

        <div class="badge" id="hStatus"></div>

        <div class="progress"><div class="progress-isi" id="hBar"></div></div>
        <div class="persen" id="hPersen"></div>

        <div class="langkah" id="hLangkah"></div>
      </div>

      <div class="box">
        <h3>Detail Pengiriman</h3>
        <table>
          <tr><td>Nomor Delivery Order</td><td id="dNomor"></td></tr>
          <tr><td>Ekspedisi</td><td id="dEkspedisi"></td></tr>
          <tr><td>Tanggal Kirim</td><td id="dTanggal"></td></tr>
          <tr><td>Jenis Paket</td><td id="dJenis"></td></tr>
          <tr><td>Total Pembayaran</td><td id="dTotal"></td></tr>
        </table>
      </div>

    </div>
  </div>

  <!-- data.js harus berada di folder yang sama dengan tracking.html -->
  <script src="data.js"></script>
  <script>
    var namaStatus = ["Pesanan Diproses", "Dikemas", "Dikirim", "Dalam Perjalanan", "Terkirim"];
    var warnaStatus = ["#6b7280", "#d97706", "#2563eb", "#7c3aed", "#16a34a"];

    function rupiah(angka) {
      return "Rp " + Number(angka).toLocaleString("id-ID");
    }

    function formatTanggal(teks) {
      var bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli",
                   "Agustus", "September", "Oktober", "November", "Desember"];
      var bagian = teks.split("-");
      return parseInt(bagian[2], 10) + " " + bulan[parseInt(bagian[1], 10) - 1] + " " + bagian[0];
    }

    // ===== TOMBOL CONTOH NOMOR DO =====
    var contoh = document.getElementById("contoh");
    for (var i = 0; i < dataPengiriman.length; i++) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = dataPengiriman[i].nomorDO;
      btn.addEventListener("click", function () {
        document.getElementById("nomorDO").value = this.textContent;
        cariPengiriman(this.textContent);
      });
      contoh.appendChild(btn);
    }

    // ===== CARI PENGIRIMAN =====
    function cariPengiriman(nomor) {
      var hasil = document.getElementById("hasil");
      var pesanError = document.getElementById("pesanError");
      var data = null;

      for (var i = 0; i < dataPengiriman.length; i++) {
        if (dataPengiriman[i].nomorDO.toLowerCase() === nomor.trim().toLowerCase()) {
          data = dataPengiriman[i];
        }
      }

      if (!data) {
        hasil.style.display = "none";
        pesanError.style.display = "block";
        pesanError.textContent = "Nomor Delivery Order \"" + nomor.trim() + "\" tidak ditemukan. Periksa kembali nomor Anda.";
        return;
      }

      pesanError.style.display = "none";
      hasil.style.display = "block";

      var warna = warnaStatus[data.status];
      var persen = Math.round(((data.status + 1) / namaStatus.length) * 100);

      // nama pemesan dan status
      document.getElementById("hNama").textContent = data.namaPemesan;
      var badge = document.getElementById("hStatus");
      badge.textContent = namaStatus[data.status];
      badge.style.background = warna;

      // progress bar
      var bar = document.getElementById("hBar");
      bar.style.background = warna;
      bar.style.width = "0";
      setTimeout(function () { bar.style.width = persen + "%"; }, 50);
      document.getElementById("hPersen").textContent = persen + "% selesai";

      // langkah-langkah status
      var langkah = document.getElementById("hLangkah");
      langkah.innerHTML = "";
      for (var j = 0; j < namaStatus.length; j++) {
        var step = document.createElement("div");
        step.className = "step";
        if (j <= data.status) { step.className += " selesai"; }
        if (j === data.status) { step.className += " aktif"; }
        step.style.setProperty("--warna", warna);

        var bulat = document.createElement("div");
        bulat.className = "bulat";
        bulat.textContent = j <= data.status ? "✓" : (j + 1);

        var teks = document.createElement("div");
        teks.textContent = namaStatus[j];

        step.appendChild(bulat);
        step.appendChild(teks);
        langkah.appendChild(step);
      }

      // detail
      document.getElementById("dNomor").textContent = data.nomorDO;
      document.getElementById("dEkspedisi").textContent = data.ekspedisi;
      document.getElementById("dTanggal").textContent = formatTanggal(data.tanggalKirim);
      document.getElementById("dJenis").textContent = data.jenisPaket;
      document.getElementById("dTotal").textContent = rupiah(data.totalPembayaran);
    }

    document.getElementById("formCari").addEventListener("submit", function (e) {
      e.preventDefault();
      cariPengiriman(document.getElementById("nomorDO").value);
    });
  </script>

</body>
</html>
