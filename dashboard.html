<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Buku Nara - Dashboard</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fffbe8;
      min-height: 100vh;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background: #78350f;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
    }
    .navbar h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
    }
    .btn-logout {
      background: #fff;
      color: #78350f;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-logout:hover { background: #fde68a; }

    /* ===== ISI ===== */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .greeting-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 8px 24px rgba(120, 53, 15, 0.12);
      margin-bottom: 32px;
    }
    .greeting-box h2 {
      font-family: Georgia, serif;
      color: #78350f;
      font-size: 28px;
    }
    .greeting-box p {
      color: #b45309;
      margin-top: 6px;
      font-size: 15px;
    }

    .menu-title {
      color: #78350f;
      font-size: 18px;
      margin-bottom: 16px;
    }

    /* ===== MENU NAVIGASI ===== */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .menu-btn {
      display: block;
      text-decoration: none;
      background: #fff;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      color: #78350f;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(120, 53, 15, 0.1);
      transition: all 0.2s;
    }
    .menu-btn .ikon {
      display: block;
      font-size: 40px;
      margin-bottom: 10px;
    }
    .menu-btn:hover {
      background: #78350f;
      color: #fff;
      transform: translateY(-4px);
    }

    @media (max-width: 600px) {
      .menu-grid { grid-template-columns: 1fr; }
      .navbar { padding: 14px 16px; }
    }
  </style>
</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <div class="navbar">
    <h1>Toko Buku Nara</h1>
    <button class="btn-logout" id="btnLogout">Logout</button>
  </div>

  <div class="container">

    <!-- ===== GREETING ===== -->
    <div class="greeting-box">
      <h2 id="greeting">Selamat Datang</h2>
      <p id="tanggal"></p>
    </div>

    <!-- ===== MENU UTAMA ===== -->
    <h3 class="menu-title">Menu Utama</h3>
    <div class="menu-grid">
      <a href="stok.html" class="menu-btn">
        <span class="ikon">📚</span>
        Informasi Stok/Katalog
      </a>
      <a href="tracking.html" class="menu-btn">
        <span class="ikon">🚚</span>
        Tracking Pengiriman
      </a>
      <a href="laporan.html" class="menu-btn">
        <span class="ikon">📝</span>
        Laporan Pemesanan
      </a>
      <a href="history.html" class="menu-btn">
        <span class="ikon">🕘</span>
        History Transaksi
      </a>
    </div>

  </div>

  <script>
    // ===== AMBIL NAMA PENGGUNA (dari halaman login) =====
    var nama = "";
    try {
      var data = JSON.parse(localStorage.getItem("userLogin"));
      if (data && data.nama) { nama = data.nama; }
    } catch (e) {}

    // ===== GREETING BERDASARKAN WAKTU LOKAL =====
    var jam = new Date().getHours();
    var sapaan;

    if (jam >= 5 && jam < 11) {
      sapaan = "Selamat Pagi";
    } else if (jam >= 11 && jam < 15) {
      sapaan = "Selamat Siang";
    } else if (jam >= 15 && jam < 18) {
      sapaan = "Selamat Sore";
    } else {
      sapaan = "Selamat Malam";
    }

    document.getElementById("greeting").textContent =
      sapaan + (nama ? ", " + nama : "") + "!";

    // ===== TANGGAL HARI INI =====
    var hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    var bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli",
                 "Agustus", "September", "Oktober", "November", "Desember"];
    var sekarang = new Date();
    document.getElementById("tanggal").textContent =
      hari[sekarang.getDay()] + ", " + sekarang.getDate() + " " +
      bulan[sekarang.getMonth()] + " " + sekarang.getFullYear();

    // ===== LOGOUT =====
    document.getElementById("btnLogout").addEventListener("click", function () {
      localStorage.removeItem("userLogin");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
