<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Buku Nara - Halaman Pemesanan</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-amber-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <a href="dashboard.html" class="text-amber-200 hover:text-white text-sm">&larr; Kembali ke Dashboard</a>
      <span class="text-amber-500">|</span>
      <h1 class="text-xl font-serif font-bold">Halaman Pemesanan (Checkout)</h1>
    </div>
    <a href="index.html" class="bg-amber-800 hover:bg-amber-700 text-xs text-amber-100 font-semibold px-4 py-2 rounded-lg transition">
      Logout
    </a>
  </nav>

  <!-- Container Utama -->
  <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Kolom Kiri: Form Informasi Pemesan & Pembayaran -->
    <div class="lg:col-span-2 space-y-6">
      
      <!-- Card Informasi Pemesan -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-amber-100">
        <h2 class="text-xl font-bold text-amber-950 mb-4 flex items-center gap-2">
          👤 Informasi Pemesan
        </h2>
        <form id="formPemesan" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Lengkap</label>
            <input type="text" id="pemesanNama" required placeholder="Budi Santoso" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-800">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Nomor Telepon / WA</label>
            <input type="tel" id="pemesanTelepon" required placeholder="081234567890" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-800">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-gray-700 mb-1">Email</label>
            <input type="email" id="pemesanEmail" required placeholder="budi@example.com" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-800">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-gray-700 mb-1">Alamat Lengkap Pengiriman</label>
            <textarea id="pemesanAlamat" rows="3" required placeholder="Jl. Merdeka No. 123, Jakarta" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-800"></textarea>
          </div>
        </form>
      </div>

      <!-- Card Informasi Pembayaran -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-amber-100">
        <h2 class="text-xl font-bold text-amber-950 mb-4 flex items-center gap-2">
          💳 Metode Pembayaran
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <label class="border rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:border-amber-800 transition">
            <input type="radio" name="metodePembayaran" value="Transfer Bank" checked class="accent-amber-900">
            <div>
              <p class="font-semibold text-sm text-gray-800">Transfer Bank</p>
              <p class="text-xs text-gray-500">BCA / Mandiri / BNI</p>
            </div>
          </label>

          <label class="border rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:border-amber-800 transition">
            <input type="radio" name="metodePembayaran" value="E-Wallet" class="accent-amber-900">
            <div>
              <p class="font-semibold text-sm text-gray-800">E-Wallet</p>
              <p class="text-xs text-gray-500">GoPay / OVO / ShopeePay</p>
            </div>
          </label>

          <label class="border rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:border-amber-800 transition">
            <input type="radio" name="metodePembayaran" value="COD" class="accent-amber-900">
            <div>
              <p class="font-semibold text-sm text-gray-800">COD</p>
              <p class="text-xs text-gray-500">Bayar di Tempat</p>
            </div>
          </label>
        </div>
      </div>

    </div>

    <!-- Kolom Kanan: Detail & Tambah/Ubah Data Pemesanan -->
    <div class="space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-amber-100 sticky top-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-amber-950">📦 Detail Pesanan</h2>
          <button onclick="openModal('modalTambahPemesanan')" class="text-xs bg-amber-900 text-white px-3 py-1.5 rounded-lg hover:bg-amber-800 font-semibold">
            + Tambah Item
          </button>
        </div>

        <!-- List Data Pemesanan (Bisa diubah/ditambah) -->
        <div id="listPemesanan" class="divide-y divide-gray-100 mb-6 max-h-80 overflow-y-auto">
          <!-- Di-render via JS -->
        </div>

        <!-- Ringkasan Total -->
        <div class="border-t border-amber-200 pt-4 space-y-2">
          <div class="flex justify-between text-sm text-gray-600">
            <span>Subtotal</span>
            <span id="subtotalTeks">Rp 0</span>
          </div>
          <div class="flex justify-between text-sm text-gray-600">
            <span>Biaya Pengiriman</span>
            <span>Rp 15.000</span>
          </div>
          <div class="flex justify-between text-base font-bold text-amber-950 pt-2 border-t">
            <span>Total Pembayaran</span>
            <span id="totalBayarTeks" class="text-amber-900">Rp 0</span>
          </div>
        </div>

        <button onclick="prosesCheckout()" class="w-full mt-6 bg-amber-900 hover:bg-amber-800 text-white font-bold py-3 rounded-xl transition shadow-md">
          Konfirmasi Pemesanan
        </button>
      </div>
    </div>

  </main>

  <!-- Modal Tambah Item Pemesanan -->
  <div id="modalTambahPemesanan" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
      <h3 class="text-xl font-bold text-amber-900 mb-4">Tambah Item Buku</h3>
      <form onsubmit="tambahItemPemesanan(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Pilih Buku</label>
          <select id="selectBuku" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-800">
            <!-- Diisi otomatis dari dataKatalogBuku -->
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Jumlah (Qty)</label>
          <input type="number" id="inputQty" min="1" value="1" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-800">
        </div>
        <div class="flex justify-end gap-2 pt-4">
          <button type="button" onclick="closeModal('modalTambahPemesanan')" class="px-4 py-2 text-sm text-gray-600 border rounded-lg">Batal</button>
          <button type="submit" class="px-4 py-2 text-sm bg-amber-900 text-white rounded-lg font-semibold">Tambah</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Notification -->
  <div id="modalAlert" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full text-center shadow-2xl">
      <div id="modalIcon" class="text-4xl mb-3">✅</div>
      <p id="alertMessage" class="text-gray-800 font-medium mb-6"></p>
      <button onclick="closeModal('modalAlert')" class="bg-amber-900 text-white px-6 py-2 rounded-lg hover:bg-amber-800 font-semibold w-full">
        Tutup
      </button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
