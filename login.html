<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Buku Nara - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center p-4">

  <!-- Card Login -->
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-amber-100">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-serif font-bold text-amber-900">Toko Buku Nara</h1>
      <p class="text-amber-700 text-sm mt-1">Silakan masuk ke akun Anda</p>
    </div>

    <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-800 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-800 outline-none">
      </div>

      <button type="submit" class="w-full bg-amber-900 hover:bg-amber-800 text-white font-semibold py-2.5 rounded-lg transition duration-200">
        Login
      </button>
    </form>

    <div class="flex justify-between items-center mt-6 text-sm">
      <button onclick="openModal('modalLupa')" class="text-amber-800 hover:underline">Lupa Password?</button>
      <button onclick="openModal('modalDaftar')" class="text-amber-900 font-semibold hover:underline">Daftar Akun</button>
    </div>
  </div>

  <!-- Modal Notification Error / Success -->
  <div id="modalAlert" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full text-center shadow-2xl">
      <div id="modalIcon" class="text-red-500 text-4xl mb-3">⚠️</div>
      <p id="alertMessage" class="text-gray-800 font-medium mb-6"></p>
      <button onclick="closeModal('modalAlert')" class="bg-amber-900 text-white px-6 py-2 rounded-lg hover:bg-amber-800 font-semibold w-full">
        Tutup
      </button>
    </div>
  </div>

  <!-- Modal Lupa Password -->
  <div id="modalLupa" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl">
      <h3 class="text-xl font-bold text-amber-900 mb-2">Lupa Password</h3>
      <p class="text-sm text-gray-600 mb-4">Masukkan email Anda untuk menerima link reset password.</p>
      <input type="email" id="emailReset" placeholder="email@domain.com" class="w-full px-4 py-2 border rounded-lg mb-4 outline-none">
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('modalLupa')" class="px-4 py-2 text-gray-600 border rounded-lg">Batal</button>
        <button onclick="submitReset()" class="px-4 py-2 bg-amber-900 text-white rounded-lg">Kirim Reset</button>
      </div>
